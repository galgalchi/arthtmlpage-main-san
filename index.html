<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0150">
  <meta name="description" content="샨의 작업 일정과 이미지 포트폴리오 갤러리">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>샨 | 일정과 포트폴리오</title>
  <link rel="stylesheet" href="./style.css?v=registered-folders-20261115-v1">
  <script defer src="./setting.js?v=registered-folders-20261115-v1"></script>
  <script defer src="./settings-data.js?v=registered-folders-20261115-v1"></script>
  <script defer src="./portfolio-carousel.js?v=registered-folders-20261115-v1"></script>
  <script defer src="./app.js?v=registered-folders-20261115-v1"></script>
</head>
<body>
  <h1 class="sr-only">샨의 일정과 포트폴리오</h1>
  <main class="container main-accordion">
    <details class="main-acc-item" id="section-calendar" open>
      <summary class="main-acc-header">
        <span class="main-acc-header-left">
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18M7 14h2m3 0h2m3 0h1m-11 4h2m3 0h2"/></svg>
          <span class="main-acc-title">일정 캘린더</span>
        </span>
        <span class="main-acc-arrow" aria-hidden="true"></span>
      </summary>
      <div class="main-acc-body">
        <div class="calendar-top">
          <div class="calendar-nav">
            <button id="calPrev" type="button" aria-label="이전 달">❮</button>
            <h2 class="calendar-month" id="calMonthLabel" aria-live="polite"></h2>
            <button id="calNext" type="button" aria-label="다음 달">❯</button>
            <button id="calToday" type="button">오늘</button>
          </div>
          <div class="calendar-legend" aria-label="일정 상태 안내">
            <span><i class="legend-dot legend-today"></i>오늘</span>
            <span><i class="legend-dot legend-available"></i>작업가능</span>
            <span><i class="legend-dot legend-deadline"></i>마감임박</span>
            <span><i class="legend-dot legend-holiday"></i>휴무</span>
            <span><i class="legend-dot legend-closed"></i>마감</span>
          </div>
        </div>
        <div class="calendar-grid" role="group" aria-labelledby="calMonthLabel">
          <div class="calendar-weekdays" aria-hidden="true"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
          <div class="calendar-days" id="calDays"></div>
        </div>
        <p class="calendar-help" style="display:none">지난 날짜는 자동으로 마감됩니다. 날짜의 메모를 누르면 전체 내용을 볼 수 있습니다.</p>
        <div class="calendar-notes" id="monthNotes" style="display:none" hidden>
          <h3>이달의 메모</h3>
          <div id="monthNoteList"></div>
        </div>
      </div>
    </details>
    <details class="main-acc-item" id="section-portfolio" open>
      <summary class="main-acc-header">
        <span class="main-acc-header-left">
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg>
          <span class="main-acc-title">포트폴리오 갤러리</span>
        </span>
        <span class="main-acc-arrow" aria-hidden="true"></span>
      </summary>
      <div class="main-acc-body">
        <div class="pf-type-tabs" id="imageTypeTabs" role="tablist" aria-label="이미지 카테고리"></div>
        <div id="imageTypeSections"></div>
      </div>
    </details>
    <noscript>일정과 포트폴리오를 보려면 브라우저에서 JavaScript를 활성화해주세요.</noscript>
  </main>
  <dialog class="memo-dialog" id="memoDialog" aria-labelledby="memoTitle">
    <div class="memo-heading"><h2 id="memoTitle"></h2><button type="button" class="dialog-close" aria-label="메모 닫기">✕</button></div>
    <p id="memoText"></p>
  </dialog>
  <dialog class="media-dialog" id="mediaDialog" aria-label="포트폴리오 확대 보기">
    <button type="button" class="dialog-close" aria-label="포트폴리오 닫기">✕</button>
    <div class="media-content" id="mediaContent"></div>
  </dialog>
</body>
</html>
